name: Cloudflare Pages

# Mirrors the published site to Cloudflare Pages (project "world-pulse") after every successful
# "Build & publish" run on main, reusing that run's Pages artifact; a manual run rebuilds the site.
# Needs the repository secrets CLOUDFLARE_API_TOKEN (Pages: Edit) and CLOUDFLARE_ACCOUNT_ID.

on:
  workflow_run:
    workflows: ["Build & publish"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: cloudflare-pages
  cancel-in-progress: true

env:
  WORLDPULSE_KOFI: ${{ vars.KOFI_PAGE }}
  WORLDPULSE_NEWSLETTER_URL: ${{ vars.NEWSLETTER_URL }}
  WORLDPULSE_CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}
  WORLDPULSE_SPONSOR_TEXT: ${{ vars.SPONSOR_TEXT }}
  WORLDPULSE_SPONSOR_URL: ${{ vars.SPONSOR_URL }}
  WORLDPULSE_TIKTOK: ${{ vars.TIKTOK_HANDLE }}

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event != 'pull_request')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check secrets
        id: secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID are not set; skipping the Cloudflare deploy."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      # After "Build & publish": take the exact site it deployed to GitHub Pages.
      - name: Download the Pages artifact
        id: artifact
        if: steps.secrets.outputs.ok == 'true' && github.event_name == 'workflow_run'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: github-pages
          path: artifact
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Unpack the artifact
        id: unpack
        if: steps.artifact.outcome == 'success'
        run: |
          mkdir -p public
          tar -xf artifact/artifact.tar -C public
          test -f public/index.html && echo "ok=true" >> "$GITHUB_OUTPUT"

      # Manual run, or the artifact is gone: rebuild exactly as publish.yml does.
      - uses: actions/checkout@v4
        if: steps.secrets.outputs.ok == 'true' && steps.unpack.outputs.ok != 'true'
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-python@v5
        if: steps.secrets.outputs.ok == 'true' && steps.unpack.outputs.ok != 'true'
        with:
          python-version: "3.12"
      - name: Build site and API
        if: steps.secrets.outputs.ok == 'true' && steps.unpack.outputs.ok != 'true'
        env:
          WORLDPULSE_BASE_URL: https://ilicvix02.github.io/Claude
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          pip install -r requirements-pro.txt
          if [ -n "$ANTHROPIC_API_KEY" ]; then pip install -r requirements-ai.txt; fi
          python -m worldpulse.build --out public --previous "$WORLDPULSE_BASE_URL/api/v1/all.json"

      - uses: actions/setup-node@v4
        if: steps.secrets.outputs.ok == 'true'
        with:
          node-version: "20"

      - name: Deploy to Cloudflare Pages
        if: steps.secrets.outputs.ok == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # Create the project on first use; "already exists" is fine.
          npx --yes wrangler@3 pages project create world-pulse --production-branch main > create.log 2>&1 \
            || grep -qi "already exists" create.log \
            || { echo "::warning::Could not create the Pages project (it may already exist):"; grep -v -i "token" create.log | tail -5; }
          npx --yes wrangler@3 pages deploy public --project-name world-pulse --branch main --commit-dirty=true
