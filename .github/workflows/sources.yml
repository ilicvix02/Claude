name: Refresh sources

# Weekly: re-discover and re-verify every feed (scripts/find_sources.py) and commit the refreshed
# config/sources.json straight to main, only when at least 1000 feeds verify and the tests pass.
on:
  schedule:
    - cron: "41 4 * * 1" # Mondays 04:41 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sources
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Discover and verify feeds
        run: python scripts/find_sources.py --min 1000

      - name: Test
        run: python -m unittest discover -s tests -v

      - name: Commit to main
        run: |
          if git diff --quiet -- config/sources.json; then echo "No changes."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add config/sources.json
          git commit -m "Refresh verified sources ($(python -c 'import json;print(len(json.load(open("config/sources.json"))["sources"]))') feeds)"
          git push origin HEAD:main
