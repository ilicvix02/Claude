name: Build & publish

on:
  schedule:
    - cron: "17 * * * *" # hourly, off the top of the hour
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test
        run: python -m unittest discover -s tests -v

      - name: Configure Pages
        id: pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      # Optional AI analysis: add an ANTHROPIC_API_KEY repository secret to enable it.
      # Without the secret the build uses rule-based analysis and costs nothing.
      - name: Install AI client
        env:
          ANTHROPIC_API_KEY: ${{ github.event_name != 'pull_request' && secrets.ANTHROPIC_API_KEY || '' }}
        if: env.ANTHROPIC_API_KEY != ''
        run: pip install -r requirements-ai.txt

      - name: Build site and API
        env:
          WORLDPULSE_BASE_URL: ${{ steps.pages.outputs.base_url }}
          ANTHROPIC_API_KEY: ${{ github.event_name != 'pull_request' && secrets.ANTHROPIC_API_KEY || '' }}
        run: |
          PREV=""
          if [ -n "$WORLDPULSE_BASE_URL" ]; then PREV="--previous $WORLDPULSE_BASE_URL/api/v1/all.json"; fi
          python -m worldpulse.build --out public $PREV

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: public

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
