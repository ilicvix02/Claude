# Optional free scheduler: copy this file to .github/workflows/protest-wire-cron.yml in your repository,
# then add two repository secrets (Settings → Secrets and variables → Actions):
#   PROTEST_WIRE_URL  e.g. https://protestwire.vercel.app
#   CRON_SECRET       the same value as in Vercel
# GitHub runs schedules "at most" every 5 minutes and can be late at busy times; cron-job.org is more punctual.
name: Protest Wire cron
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Run the pipeline
        env:
          URL: ${{ secrets.PROTEST_WIRE_URL }}
          KEY: ${{ secrets.CRON_SECRET }}
        run: curl -fsS --max-time 150 -H "Authorization: Bearer $KEY" "$URL/api/cron" | head -c 2000
