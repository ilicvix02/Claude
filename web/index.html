<body>
  <a class="skip" href="#view" data-i18n="chrome.skip">Skip to content</a>
  <header class="masthead">
    <button class="icon-btn back" id="back" aria-label="Back" data-i18n-aria="chrome.back" hidden>
      <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <a class="brand" href="#/brief" tabindex="-1" aria-hidden="true">
      <svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="11"/><path d="M3 17h6l3-7 5 13 3-6h9"/></svg>
    </a>
    <a class="nameplate" href="#/brief">World Pulse</a>
    <div class="mast-end">
      <button class="lang-btn" id="lang-btn" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="lang-menu" aria-label="Language">EN</button>
      <button class="icon-btn refresh" id="refresh" aria-label="Refresh" data-i18n-aria="chrome.refresh">
        <svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.7M20 4v5h-5"/></svg>
      </button>
    </div>
    <div class="lang-menu" id="lang-menu" hidden></div>
  </header>
  <div class="dateline">
    <time id="today"></time>
    <span id="updated" class="updated"></span>
    <span id="live" class="live" hidden data-i18n="chrome.live">Live</span>
  </div>
  <nav class="sections" id="sections" aria-label="Sections" data-i18n-aria="chrome.sections">
    <a href="#/brief" data-sec="brief" data-i18n="sec.top">Top stories</a>
    <a href="#/conflicts" data-sec="conflicts" data-i18n="sec.conflicts">Conflicts</a>
    <a href="#/feed" data-sec="feed" data-i18n="sec.latest">Latest</a>
    <!-- topic sections are added from the API's category list -->
  </nav>

  <div class="banner offline" id="offline" hidden data-i18n="chrome.offline">You're offline — showing the last saved update.</div>

  <main id="view" class="view" tabindex="-1" aria-live="polite">
    <div class="skeleton" aria-hidden="true"><div></div><div></div><div></div><div></div><div></div></div>
  </main>

  <nav class="tabbar" aria-label="App" data-i18n-aria="chrome.tabs">
    <a href="#/stories" data-tab="stories">
      <svg viewBox="0 0 24 24"><rect x="5" y="2.5" width="14" height="19" rx="3"/><path d="M9 8h6M9 12h6"/></svg><span data-i18n="stories.tab">Stories</span>
    </a>
    <a href="#/brief" data-tab="brief">
      <svg viewBox="0 0 24 24"><path d="M4 5h16v14H4zM8 9h8M8 13h8M8 17h5"/></svg><span data-i18n="tab.today">Today</span>
    </a>
    <a href="#/conflicts" data-tab="conflicts">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3.5"/><path d="M12 1v4M12 19v4M1 12h4M19 12h4"/></svg><span data-i18n="tab.conflicts">Conflicts</span>
    </a>
    <a href="#/feed" data-tab="feed">
      <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg><span data-i18n="tab.latest">Latest</span>
    </a>
    <a href="#/saved" data-tab="saved">
      <svg viewBox="0 0 24 24"><path d="M6 3h12v18l-6-4-6 4z"/></svg><span data-i18n="tab.saved">Saved</span>
    </a>
    <a href="#/more" data-tab="more">
      <svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg><span data-i18n="tab.more">More</span>
    </a>
  </nav>

  <div class="toast" id="toast" role="status" hidden></div>
  <noscript><p class="noscript">World Pulse needs JavaScript. The raw data is at <a href="api/v1/index.json">api/v1/index.json</a>.</p></noscript>
  <script src="config.js"></script>
  <script src="i18n.js"></script>
  <script src="i18n-de.js"></script>
  <script src="i18n-sr.js"></script>

  <script src="land.js" defer></script>
  <script src="stories.js" defer></script>
  <script src="app.js" defer></script>
</body>
</html>
